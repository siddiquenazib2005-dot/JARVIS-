# AURIX build settings
#
# NOTE: android.aapt2FromMavenOverride was previously pinned to a Termux path
# (/data/data/com.termux/files/usr/bin/aapt2). That path only exists on the
# original Termux phone build environment and breaks every other machine,
# including GitHub Actions runners and Android Studio. It has been removed so
# Gradle uses the AAPT2 binary that ships with the Android Gradle Plugin.

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
